<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | HarvestLink</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
        <a href="index.html" class="logo">HarvestLink</a>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="login.html">Login</a>
        </nav>
    </header>
    <main>
        <section class="auth-container register-container">
            <h1>Create Account</h1>
            <form id="registerForm" action="#" method="POST" novalidate>
                <div class="form-group"><label for="fullName">Full Name</label><input id="fullName" name="fullName" type="text" required></div>
                <div class="form-group"><label for="email">Email Address</label><input id="email" name="email" type="email" required></div>
                <div class="form-group"><label for="phone">Phone Number</label><input id="phone" name="phone" type="tel" required></div>
                <div class="form-group"><label for="location">Location</label><input id="location" name="location" type="text" required></div>
                <div class="form-group"><label for="role">Role</label><select id="role" name="role" required><option value="">Select role</option><option value="farmer">Farmer</option><option value="consumer">Consumer</option><option value="collector">Collector</option><option value="driver">Driver</option></select></div>
                <div class="form-group"><label for="password">Password</label><input id="password" name="password" type="password" required></div>
                <button type="submit">Register</button>
            </form>
        </section>
    </main>
    <footer class="footer"><p>&copy; 2026 HarvestLink. All rights reserved.</p></footer>
    <script src="js/utils.js"></script><script src="js/store.js"></script><script src="js/auth.js"></script><script src="js/script.js"></script>
</body>
</html>
