<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | HarvestLink</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
        <a href="index.html" class="logo">HarvestLink</a>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="register.html">Register</a>
        </nav>
    </header>

    <main>
        <section class="auth-container">
            <h1>Welcome Back!</h1>
            <p class="text-center">Login to your HarvestLink account.</p>
            <form id="loginForm" action="#" method="POST" novalidate>
                <div class="form-group">
                    <label for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" name="email" autocomplete="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" name="password" autocomplete="current-password" placeholder="Enter your password" required>
                </div>
                <div id="loginMessage" class="form-message" role="status" aria-live="polite"></div>
                <button type="submit">Login</button>
            </form>
            <p class="text-center mt-2">Don't have an account? <a href="register.html">Create Account</a></p>
        </section>
    </main>

    <footer class="footer"><p>&copy; 2026 HarvestLink. All rights reserved.</p></footer>
    <script src="js/utils.js"></script>
    <script src="js/store.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
